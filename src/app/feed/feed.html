<div class="container">
  <div class="row mt-5 mb-5">
    <div class="col-md-4">
      <div class="card border-0" style="width: 18rem">
        <div class="d-flex justify-content-center">
          <img
            src="https://avatars.githubusercontent.com/u/71469302?v=4"
            class="card-img-top rounded-circle w-75"
            alt="Foto do meu perfil no github"
          />
        </div>
        <div class="card-body">
          <h5 class="cart-title text-center">Vinicius Martins</h5>
          <p class="card-text text-center">Desenvolvedor Front-End</p>
          <a
            href="https://avatars.githubusercontent.com/u/71469302?v=4"
            class="btn btn-outline-dark d-flex justify-content-center"
            target="_blank"
            >Github</a
          >
          <hr class="mt-4 mb-4" />
          <h6 class="mb-3 font-monospace text-center">Pesquisar por título</h6>
          <input type="text" class="form-control mb-3 w-100" />
          <button class="btn btn-outline-warning w-100">Pesquisar</button>
        </div>
      </div>
    </div>
    <div class="col-md-8">
      <div>
        <h3 class="text-center mb-4 font-monospace">Digite abaixo os seus comentários</h3>
        <div class="form-group">
          <label for="name" class="font-monospace">Nome</label>
          <input
            type="text"
            name="name"
            id="name"
            class="form-control"
            placeholder="Digite o seu nome da postagem"
            [(ngModel)]="post.name"
          />
        </div>
        <div class="form-group">
          <label for="message" class="font-monospace">Mensagem</label>
          <textarea
            type="text"
            name="message"
            id="message"
            class="form-control"
            cols="30"
            rows="4"
            placeholder="Digite a sua mensagem"
            [(ngModel)]="post.message"
          ></textarea>
        </div>
        <div class="d-flex justify-content-end mt-3">
          <button type="button" class="btn btn-outline-info w-25" (click)="handleSubmitComment()">
            Publicar
          </button>
        </div>
      </div>
      <hr class="mt-5 mb-5" />

      <h3 class="text-center mb-4 font-monospace">Comentário adicionados</h3>

      <div class="container">
        @for (post of listPost(); track post.id) {
          <div class="card mb-4">
            <div class="card-header">
              <h5 class="card-title">{{ post.createdDate | date: 'EEEE, MMMM d, y' }}</h5>
            </div>
            <div class="card-body">
              <p class="card-text">{{ post.name }}</p>
              <p class="card-text">{{ post.message }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
